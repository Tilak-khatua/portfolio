    <script>
      // Inline and in <head> so it runs before the browser restores scroll.
      // A deferred module script executes too late to reliably prevent it.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      // Belt and braces: the page grows as fonts/pins settle, and some browsers
      // re-apply the old offset once the document is tall enough to allow it.
      window.addEventListener('load', function () {
        window.scrollTo(0, 0);
      });
    </script>
